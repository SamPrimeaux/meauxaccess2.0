name = "iaccess-api"
main = "src/index.ts"
compatibility_date = "2024-12-07"
compatibility_flags = ["nodejs_compat"]

account_id = "ede6590ac0d2fb7daf155b35653457b2"

# R2 Buckets
[[r2_buckets]]
binding = "R2_ASSETS"
bucket_name = "inneranimalmedia-assets"

[[r2_buckets]]
binding = "R2_PHOTOS"
bucket_name = "inneranimalmedia-assets"

[[r2_buckets]]
binding = "R2_WEBSITE"
bucket_name = "meauxbilityorgfinal"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "meaux-work-storage"

[[r2_buckets]]
binding = "R2_COMPONENTS"
bucket_name = "meauxstack-components"

[[r2_buckets]]
binding = "R2_DOCS"
bucket_name = "meauxbility-docs"

[[r2_buckets]]
binding = "R2_IAUTODIDACT"
bucket_name = "iautodidactorg"

[[r2_buckets]]
binding = "R2_CONNOR"
bucket_name = "connor-mcneely"

[[r2_buckets]]
binding = "R2_FRED"
bucket_name = "fred-williams"

[[r2_buckets]]
binding = "R2_AMBER"
bucket_name = "amber-nicole"

[[r2_buckets]]
binding = "R2_TRASH"
bucket_name = "inneranimalmedia-trash"

# D1 Databases
[[d1_databases]]
binding = "DB"
database_name = "meauxstack-saas-db"
database_id = "ee3e3adb-da99-457d-8c2c-390ff19f6435"

[[d1_databases]]
binding = "SAAS_DB"
database_name = "meauxstack-saas-db"
database_id = "ee3e3adb-da99-457d-8c2c-390ff19f6435"

# Environment Variables
[vars]
ACCOUNT_ID = "ede6590ac0d2fb7daf155b35653457b2"
CLOUDFLARE_IMAGES_ACCOUNT_HASH = "g7wf09fCONpnidkRnR_5vw"
R2_S3_ENDPOINT = "https://ede6590ac0d2fb7daf155b35653457b2.r2.cloudflarestorage.com"

# Scheduled Triggers (Cron)
# Clean up trash bin daily at 2 AM UTC
[triggers]
crons = ["0 2 * * *"]  # Daily at 2:00 AM UTC

# Secrets (set via: wrangler secret put SECRET_NAME)
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_IMAGES_API_TOKEN (for Cloudflare Images)
# - R2_ACCESS_KEY_ID (optional - for S3 API access)
# - R2_SECRET_ACCESS_KEY (optional - for S3 API access)
