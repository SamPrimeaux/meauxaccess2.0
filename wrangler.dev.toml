# Wrangler configuration for meauxaccess-dashboard-dev Worker
# Development/Validation worker for MeauxAccess 2.0
# Cloudflare-native build (R2, D1, KV, Workers)

name = "meauxaccess-dashboard-dev"
main = "src/meauxaccess-dashboard.ts"
compatibility_date = "2024-11-24"
compatibility_flags = ["nodejs_compat"]

# Account
account_id = "ede6590ac0d2fb7daf155b35653457b2"

# Routes
# Deployed to: meauxaccess-dashboard-dev.meauxbility.workers.dev
# Preview URLs: *-meauxaccess-dashboard-dev.meauxbility.workers.dev

# D1 Databases (shared with production for validation)
[[d1_databases]]
binding = "DB"
database_name = "meauxstack-saas-db"
database_id = "ee3e3adb-da99-457d-8c2c-390ff19f6435"

[[d1_databases]]
binding = "meauxxbility"
database_name = "meauxbility-api-db"
database_id = "49b16b7d-ecb9-4cc4-b337-559f94854757"

[[d1_databases]]
binding = "SAAS_DB"
database_name = "meauxstack-saas-db"
database_id = "ee3e3adb-da99-457d-8c2c-390ff19f6435"

[[d1_databases]]
binding = "MEAUX_WORK_DB"
database_name = "meaux-work-db"
database_id = "2a3a763a-92f1-4633-849e-268ddb31998f"

[[d1_databases]]
binding = "INNERANIMAL_DB"
database_name = "inneranimalmedia-assets"
database_id = "e0ec00b8-4e3c-422e-abba-70b7548c1f87"

# R2 Buckets (shared with production for validation)
