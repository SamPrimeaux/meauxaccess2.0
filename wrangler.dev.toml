# Environment Variables
[vars]
CLOUDFLARE_ACCOUNT_ID = "ede6590ac0d2fb7daf155b35653457b2"
CLOUDFLARE_IMAGES_ACCOUNT_HASH = "g7wf09fCONpnidkRnR_5vw"
CLOUDFLARE_STREAM_CUSTOMER_ID = "customer-8y3087qnrzz7ql2e.cloudflarestream.com"
ENABLE_HEADER_INJECTION = "true"
ENVIRONMENT = "dev"
PRODUCTION_URL = "https://meauxaccess-dashboard-dev.meauxbility.workers.dev"
R2_ENDPOINT = "https://ede6590ac0d2fb7daf155b35653457b2.r2.cloudflarestorage.com"
R2_PUBLIC_URL = "https://pub-b2c86021de114066bc2eefa2e0ee3250.r2.dev"
TURN_TOKEN_ID = "d3d62f0405715d6c62565a4bc989218b"

# Secrets (set via: wrangler secret put SECRET_NAME --config wrangler.dev.toml)
# - CLOUDFLARE_API_TOKEN (for accessing Cloudflare API if needed)
# - CLOUDFLARE_IMAGES_API_TOKEN (for Cloudflare Images API)
# - OPENAI_API_KEY (for ChatGPT integration - optional for dev)
# - RESEND_API_KEY (for email notifications - optional for dev)
# - GEMINI_API_KEY (for Gemini integration - optional for dev)
# - ANTHROPIC_API_KEY (for Claude integration - optional for dev)

